name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false

      - name: Install dependencies
        run: npm ci

      - name: Check Linux x64
        if: matrix.os == 'ubuntu-22.04'
        run: npm run check

      - name: Test TypeScript on macOS and Windows
        if: matrix.os != 'ubuntu-22.04'
        run: npm run test:typescript

      - name: Test Rust on macOS and Windows
        if: matrix.os != 'ubuntu-22.04'
        run: npm run test:rust

      - name: Smoke-test Linux npm package
        if: runner.os == 'Linux'
        run: >
          node scripts/release/smoke-npm-package.mjs
          --target linux-x64
          --version 0.1.6-ci.0

  check-linux-arm64:
    name: Check Linux ARM64
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup npm
        run: npm install --global npm@11.8.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-workspace-crates: false
          cache-on-failure: false

      - name: Install dependencies
        run: npm ci

      - name: Test TypeScript on Linux ARM64
        run: npm run test:typescript

      - name: Test Rust on Linux ARM64
        run: npm run test:rust

      - name: Smoke-test Linux ARM64 npm package
        run: >
          node scripts/release/smoke-npm-package.mjs
          --target linux-arm64
          --version 0.1.6-ci.0
